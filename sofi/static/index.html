// ---- chat ----
function reveal(b,html,raw){if(raw.length<40||matchMedia('(prefers-reduced-motion:reduce)').matches){b.innerHTML=html;return}let i=0;const st=Math.max(2,Math.ceil(raw.length/80)),iv=setInterval(()=>{i+=st;b.textContent=raw.slice(0,i);$('chat').scrollTop=1e9;if(i>=raw.length){clearInterval(iv);b.innerHTML=html}},22)}
function say(t,u,meta){const d=document.createElement('div');d.className='msg '+(u?'u':'ia');const b=document.createElement('div');b.className='tx';d.appendChild(b);$('chat').appendChild(d);
if(u)b.textContent=t;else if(meta)reveal(b,md(meta.raw),meta.raw);else b.innerHTML=t;
if(meta){const m=document.createElement('div');m.className='mt';m.innerHTML=`<span>${esc(meta.tag)}</span><button data-v="1" title="Buena respuesta">👍</button><button data-v="-1" title="Mala respuesta">👎</button>`;
m.onclick=e=>{const v=e.target.dataset&&e.target.dataset.v;if(v){fetch('/api/feedback',{method:'POST',body:JSON.stringify({id:meta.id,v:+v})});m.querySelectorAll('button').forEach(x=>x.style.opacity=x==e.target?1:.2)}};d.appendChild(m);if(meta.fuentes&&meta.fuentes.length){const q=document.createElement('div');q.className='src';q.innerHTML=meta.fuentes.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">[${f.n}] ${esc((f.titulo||f.url).slice(0,46))}</a>`).join('');d.appendChild(q)}}
$('chat').scrollTop=1e9;return d}
const typing=()=>{const d=document.createElement('div');d.className='msg ia';d.innerHTML='<div class="tx ty"><i></i><i></i><i></i></div>';$('chat').appendChild(d);$('chat').scrollTop=1e9;return d};
async function brain(t){if(!server)return'Para conversar con el cerebro ANP abre Sofi desde tu servidor. Los comandos de cartera sí funcionan aquí.';
const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({texto:t,cartera:S,hist:HIST.slice(-6)})});
if(r.status==401){location.reload();return''}const d=await r.json();if(d.error)return'⚠️ '+esc(d.error);HIST.push({role:'user',content:t},{role:'assistant',content:d.texto});
LM={id:d.id,raw:d.texto,fuentes:d.fuentes||[],acc:d.acciones||[],tag:(d.usados&&d.usados.length?d.usados.join(' + '):'ANP')+(d.verif?` · verificado ${Math.round(d.verif*100)}%`:'')};return d.texto}
async function send(t,voz){t=(t||$('q').value).trim();if(!t)return;$('q').value='';say(t,1);stopSpeak();setOrb('think');const w=typing();let r,meta=null;
try{r=await cmd(t);meta=LM;LM=null}catch(e){r='Error: '+esc(e)}w.remove();const plain=meta?meta.raw:String(r).replace(/<br>/g,'\n').replace(/<[^>]+>/g,'');
if(meta)say('',0,meta);else say(r);if(meta&&meta.acc)for(const a of meta.acc){say(await cmd(a))}setOrb('idle');if(voz||conv||VZ.on)hablar(plain);else if(conv)escuchar()}
const num=s=>+String(s).replace(/,/g,'');
async function cmd(t){const l=t.toLowerCase().trim().replace(/\s+/g,' ');let m;
if(m=l.match(/^(?:agrega|añade|anade|compra|compré|compre|suma|anota)\s+([\d.,]+)\s*(?:de\s+)?([a-z0-9]{2,10})(?:\s+(?:a|@|por)\s+\$?([\d.,]+)\s*(usd|usdt|mxn|pesos)?)?/)){
const q=num(m[1]),s=m[2].toUpperCase();let a=S.a.find(x=>x.s==s),nw=!a;if(nw){a={s,n:s,q:0,c:0,p:0,h:[]};S.a.push(a)}
try{await hist(a)}catch(e){if(nw&&!m[3]){S.a.pop();return`❌ No encontré <b>${s}USDT</b> en Binance (¿sin conexión o símbolo inválido?). Si quieres agregarlo igual, dime el precio: <i>agrega ${m[1]} ${s} a 10 usd</i>.`}}
let pr=m[3]?num(m[3])*(/usd/.test(m[4]||'')?S.fx:1):a.p;if(!pr){S.a=S.a.filter(x=>x!=a);return'Necesito un precio para ese activo.'}if(!a.p)a.p=pr;
a.c=(a.c*a.q+pr*q)/(a.q+q);a.q+=q;save();render();return`✅ ${nw?'Agregué':'Sumé'} <b>${f(q,8)} ${s}</b> a $${fp(pr)} MXN. Ahora tienes ${f(a.q,8)} ${s} (costo prom. $${fp(a.c)}). ${a.h.length?`Cargué ${a.h.length} días de histórico de Binance.`:'Sin histórico (sin conexión).'}`}
if(m=l.match(/^(?:vende|vendí|vendi|venta de)\s+(todo|[\d.,]+)\s*(?:de\s+)?([a-z0-9]{2,10})/)){const a=S.a.find(x=>x.s==m[2].toUpperCase());if(!a)return'No tengo ese activo.';const q=m[1]=='todo'?a.q:Math.min(a.q,num(m[1])),g=q*(a.p-a.c);S.real+=g;a.q-=q;let e='';if(a.q<=1e-12){S.a=S.a.filter(x=>x!=a);e=' Posición cerrada.'}save();render();return`✅ Vendí ${f(q,8)} ${a.s}. PNL realizado: <b class="${cl(g)}">$${f(g)} MXN</b> (acumulado $${f(S.real)}).${e}`}
if(m=l.match(/^(?:quita|elimina|borra)\s+([a-z0-9]{2,10})/)){const n=S.a.length;S.a=S.a.filter(x=>x.s!=m[1].toUpperCase());save();render();return n>S.a.length?'🗑️ Eliminado.':'No lo encontré.'}
if(m=l.match(/^(fx|meta|aporte|rendimiento|peso max)\s+\$?([\d.,]+)/)){const v=num(m[2]),k=m[1];if(k=='fx')S.fx=v;else if(k=='meta')S.meta=v;else if(k=='aporte')S.ap=v;else if(k=='rendimiento')S.rm=v>1?v/100:v;else S.maxW=v>1?v/100:v;S.a.forEach(a=>{if(a.u)a.p=a.u*S.fx});save();render();return`⚙️ ${k} = ${v}`}
if(/sincroniza|actualiza|binance/.test(l)){const n=await sync();return`🔄 ${n}/${S.a.length} activos sincronizados con Binance.`+(n<S.a.length?' Los que fallan marcan ⚠️ (¿sin conexión o par inexistente?).':'')}
if(/export|descarga|respaldo/.test(l)){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=document.createElement('a');u.href=URL.createObjectURL(b);u.download='cartera_ia.json';u.click();return'💾 Respaldo descargado.'}
if(/reinicia|reset/.test(l)){S=D0();save();render();return'Restablecí tu cartera original del Excel.'}
if(!/^(resumen|analiza|riesgo|cartera|como va|cómo va)/.test(l))return await brain(t);
const T=tot(),st=stats(),sc=score(st),A=S.a.map(a=>({a,w:V(a)/T,x:act(a,V(a)/T)})),top=A.sort((x,y)=>y.w-x.w)[0],bad=A.filter(z=>z.x[1]=='r'||z.x[1]=='a');
return`📊 Score <b>${f(sc.s,0)}/100</b>. Mayor posición: <b>${top.a.s}</b> (${f(top.w*100,1)}%). PNL ${pc(T/cost()-1)}.`+(bad.length?'<br>Atención: '+bad.map(z=>`${z.a.s} → ${z.x[0]}`).join('; '):'<br>Sin alertas.')+(st.vol?`<br>Vol. anual ${f(st.vol*100,0)}%, VaR95 mensual ${f(st.var*100,1)}%.`:'')+`<br>Factor que más resta: <b>${sc.F.map(([n,v,w])=>[n,w*(1-v)]).sort((x,y)=>y[1]-x[1])[0][0]}</b>.`}
function render(){const T=tot(),C=cost()||1,st=stats(),sc=score(st),pn=T-C,A=S.a.slice().sort((a,b)=>V(b)-V(a));
$('st').textContent=S.t?'Binance '+new Date(S.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'datos de tu Excel';
const V0=T/S.fx;$('kp').innerHTML=[['Valor','$'+f(T),'US$'+f(V0)],['PNL',pc(pn/C),'$'+f(pn)],['Meta',f(V0/S.meta*100,3)+'%','de US$'+f(S.meta,0)]].map((k,i)=>`<div class="card"><h3>${k[0]}</h3><div class="big ${i==1?cl(pn):''}">${k[1]}</div><div class="sm m">${k[2]}</div></div>`).join('');
line(st.ps);$('rk').textContent=st.n?`Volatilidad ${f(st.vol*100,0)}% · caída máx. ${f(st.dd*100,1)}% · VaR95 mensual ${f(st.var*100,1)}%`:'Sincroniza con Binance para ver el histórico.';
$('pos').innerHTML=A.map(a=>{const w=V(a)/T,[x,c]=act(a,w),p=a.p/a.c-1;return`<div class="pos"><div><b>${a.s}</b><div class="m sm">${a.n}${a.err?' · sin datos de Binance':''}</div></div><div><div class="bar"><i style="width:${Math.min(100,w*100)}%"></i></div><div class="m sm">${f(w*100,1)}%</div></div><div class="pr"><b>$${f(V(a))}</b><div class="${cl(p)} sm">${pc(p)}</div></div><div class="ac ${c} sm">${x}</div></div>`}).join('');
let acc=0;$('dn').style.background='conic-gradient('+A.map((a,i)=>{const s=acc;acc+=V(a)/T*100;return`${COL[i%10]} ${s}% ${acc}%`}).join(',')+')';
$('lg').innerHTML=A.map((a,i)=>`<span><b style="background:${COL[i%10]}"></b>${a.s}</span>`).join('');
const w=sc.F.map(([n,v,p])=>[n,p*(1-v)]).sort((x,y)=>y[1]-x[1])[0][0],col=sc.s>=60?'g':sc.s>=40?'a':'r';
$('sco').innerHTML=`<div class="ring ${col}">${f(sc.s,0)}<span class="m" style="font-size:15px;font-weight:400">/100</span></div><div class="sm m">Lo que más resta: ${w} · ${f(sc.ef,1)} activos equivalentes</div>`;
const yr=k=>{const x=proj(V0,k);return x>=720?'>60 años':f(x/12,1)+' años'};
$('meta').innerHTML=`<div class="bar" style="height:8px"><i style="width:${Math.max(1,V0/S.meta*100)}%"></i></div><div class="sm m" style="margin:8px 0">Con $${S.ap}/mes y ${f(S.rm*100,1)}% mensual (supuesto tuyo)</div><div class="row sm"><span>Pesimista <b>${yr(.4)}</b></span><span>Base <b>${yr(1)}</b></span><span>Optimista <b>${yr(1.8)}</b></span></div>`}

$('mt').innerHTML=`<div class="card"><h3>Estado</h3><div class="st"><span>Cerebro ANP</span><b class="${d.estado.anp=='activo'?'g':'a'}">${esc(d.estado.anp)}</b></div><div class="st"><span>LLM</span><b>${d.llm&&d.llm.activo?esc(d.llm.modelo):'sin conectar'}</b></div>${d.llm&&d.llm.error?`<div class="sm r">${esc(d.llm.error)}</div>`:''}<div class="st"><span>Búsqueda web</span><b>${((d.busqueda||{}).motores||[]).map(esc).join(' · ')||'—'}</b></div><div class="st"><span>Modelo APEX</span><b>${esc(ap.backend||'—')}</b></div><div class="st"><span>Memoria / documentos</span><b>${ap.recuerdos??'—'} / ${ap.rag??'—'}</b></div></div>

<div class="card"><h3>Pensamiento autónomo</h3>${(d.pensamientos||[]).map(p=>`<div class="sm" style="padding:4px 0">• ${esc(p)}</div>`).join('')||'<span class="m sm">Sin pensamientos todavía.</span>'}</div>
<div class="card"><h3>Aprendizaje</h3><div class="st"><span>Conversaciones guardadas</span><b>${A.total}</b></div><div class="st"><span>👍 Buenas / 👎 Malas</span><b>${A.buenas} / ${A.malas}</b></div><div class="bar" style="margin:10px 0"><i style="width:${Math.min(100,A.buenas/A.minimo_entrenar*100)}%"></i></div>
<p class="sm m">Cada 👍 enseña a ANP al instante y se suma al dataset para afinar el LLM. Con ${A.minimo_entrenar} buenas respuestas ya puedes entrenarlo en una GPU (ver ENTRENAR_LLM.md).</p><a href="/api/dataset" download="dataset_sofi.jsonl"><button class="q" style="margin-top:8px">Descargar dataset</button></a></div>`}catch(e){}}
